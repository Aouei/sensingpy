              - rename_by_enum: api/image/#sensingpy.image.Image.rename_by_enum
              - reproject: api/image/#sensingpy.image.Image.reproject
              - align: api/image/#sensingpy.image.Image.align
              - merge: api/image/#sensingpy.image.Image.merge
              - resample: api/image/#sensingpy.image.Image.resample
              - clip: api/image/#sensingpy.image.Image.clip
              - mask: api/image/#sensingpy.image.Image.mask
              - geometry_mask: api/image/#sensingpy.image.Image.geometry_mask
              - dropna: api/image/#sensingpy.image.Image.dropna
              - select: api/image/#sensingpy.image.Image.select
              - add_band: api/image/#sensingpy.image.Image.add_band
              - drop_bands: api/image/#sensingpy.image.Image.drop_bands
              - keep_bands: api/image/#sensingpy.image.Image.keep_bands
              - normalized_diference: api/image/#sensingpy.image.Image.normalized_diference
