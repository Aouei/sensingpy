site_name: sensingpy
site_description: A Python package for geospatial image processing and analysis
site_author: Sergio Heredia
site_url: https://aouei.github.io/sensingpy/

repo_name: Aouei/sensingpy
repo_url: https://github.com/Aouei/sensingpy
edit_uri: ""

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: amber
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: amber
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.expand
    - toc.follow
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            group_by_category: true
            show_signature_annotations: true
            separate_signature: true
            show_category_heading: true
            show_if_no_docstring: true
            inherited_members: false
            filters:
              - "!^_"
            docstring_section_style: table
            merge_init_into_class: true
            show_docstring_attributes: true
            show_docstring_parameters: true
            heading_level: 2
  - mkdocs-jupyter:
      include_source: true
      execute: false
      allow_errors: true
      kernel_name: python3
      show_input: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - pymdownx.mark
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 4

nav:
  - Home: index.md
  - User Guide:
      - user_guide/index.md
      - Reading Data:
          - Reading NetCDF: notebooks/reading_netcdf.ipynb
          - Reading TIFF: notebooks/reading_tif.ipynb
      - Preprocessing:
          - Preprocessing Overview: notebooks/preprocessing.ipynb
          - Deglinting: notebooks/deglinting.ipynb
      - Remote Sensing:
          - Water Remote Sensing: notebooks/remote_sensing_water.ipynb
      - Bathymetry:
          - Stumpf Model: notebooks/SDB_stumpf.ipynb
          - Caballero & Stumpf Model: notebooks/SDB_caballero_stumpf.ipynb
  - Architecture:
      - Class Diagram: architecture/class-diagram.md
  - API Reference:
      - api/index.md
      - Core Modules:
