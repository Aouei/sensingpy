name: Build and Deploy Documentation

on:
  repository_dispatch:
    types: [trigger-docs]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install sphinx sphinx-rtd-theme sphinx-autodoc-typehints myst-parser sphinx-book-theme nbsphinx ipython

      - name: Extract version from pyproject.toml
        id: get_version
        run: |
          VERSION=$(grep -oP '(?<=version = ")[^"]*' pyproject.toml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Building docs for version $VERSION"

      - name: Update version in Sphinx conf.py
        run: |
          sed -i "s/release = .*/release = '${{ steps.get_version.outputs.version }}'/" sphinx/source/conf.py
          sed -i "s/version = .*/version = '${{ steps.get_version.outputs.version }}'/" sphinx/source/conf.py

      - name: Build documentation
        run: |
          cd sphinx
          make clean
          make html
          echo "✅ Documentation built successfully"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./sphinx/build/html
          publish_branch: gh-pages
          force_orphan: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'docs: update documentation to version ${{ steps.get_version.outputs.version }}'
