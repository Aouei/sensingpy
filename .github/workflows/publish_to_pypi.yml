name: Auto Release and Publish

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  auto-release:
    runs-on: ubuntu-latest
    # Solo ejecutar si el commit contiene [release-major], [release-minor], o [release-patch]
    if: |
      contains(github.event.head_commit.message, '[release-major]') ||
      contains(github.event.head_commit.message, '[release-minor]') ||
      contains(github.event.head_commit.message, '[release-patch]')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine version bump type
        id: bump_type
        run: |
          if [[ "${{ github.event.head_commit.message }}" == *"[release-major]"* ]]; then
            echo "type=major" >> $GITHUB_OUTPUT
            echo "🚀 MAJOR version bump detected"
          elif [[ "${{ github.event.head_commit.message }}" == *"[release-minor]"* ]]; then
            echo "type=minor" >> $GITHUB_OUTPUT
            echo "✨ MINOR version bump detected"
          else
            echo "type=patch" >> $GITHUB_OUTPUT
            echo "🐛 PATCH version bump detected"
          fi

      - name: Get current version and bump
        id: version
        run: |
          # Extraer versión actual
          CURRENT_VERSION=$(grep -oP '(?<=version = ")[^"]*' pyproject.toml)
          echo "current=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          
          # Separar componentes de versión
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          
          # Incrementar según el tipo
          if [ "${{ steps.bump_type.outputs.type }}" = "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "${{ steps.bump_type.outputs.type }}" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi
          
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "new=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $CURRENT_VERSION → $NEW_VERSION"

      - name: Update version in pyproject.toml
        run: |
          sed -i 's/version = ".*"/version = "${{ steps.version.outputs.new }}"/' pyproject.toml
          echo "✅ Updated pyproject.toml to version ${{ steps.version.outputs.new }}"

      - name: Update version in Sphinx config
        run: |
          sed -i "s/release = .*/release = '${{ steps.version.outputs.new }}'/" sphinx/source/conf.py
          sed -i "s/version = .*/version = '${{ steps.version.outputs.new }}'/" sphinx/source/conf.py
          echo "✅ Updated Sphinx config to version ${{ steps.version.outputs.new }}"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml sphinx/source/conf.py
          git commit -m "chore: Bump version to ${{ steps.version.outputs.new }} [skip ci]"
          git push origin main

      - name: Create and push tag
        run: |
          git tag -a "v${{ steps.version.outputs.new }}" -m "Release version ${{ steps.version.outputs.new }}"
          git push origin "v${{ steps.version.outputs.new }}"
          echo "🏷️ Created and pushed tag v${{ steps.version.outputs.new }}"

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.new }}
          release_name: Release v${{ steps.version.outputs.new }}
          body: |
            ## Changes in v${{ steps.version.outputs.new }}
            
            **Type**: ${{ steps.bump_type.outputs.type }} version bump
            **Previous version**: ${{ steps.version.outputs.current }}
            
            ### Documentation
            📚 [View Documentation](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }})
            
            ### Installation
            ```bash
            pip install sensingpy==${{ steps.version.outputs.new }}
            ```
          draft: false
          prerelease: false

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
